{% extends "shop/layout.html" %}{% block title %}Refer a friend{% endblock %}{% block content %}<main class="container panel"><h1>Refer a friend</h1><p>Share your code with a new customer.</p><strong id="ref-code">{{ referral_code }}</strong><button class="btn" type="button" data-share-url="{{ request.url_root }}?ref={{ referral_code }}" data-share-title="RR Foods referral">Share referral</button><button class="btn btn--ghost" type="button" onclick="navigator.clipboard.writeText(document.getElementById('ref-code').textContent)">Copy code</button><p>Referral rewards are subject to order verification and abuse checks.</p></main>{% endblock %}
