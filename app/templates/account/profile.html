{% extends "shop/layout.html" %}{% block title %}Edit profile | RR FOODS{% endblock %}{% block content %}<div class="container narrow2"><h1 class="pg-h">Edit profile</h1><form class="panel2" method="post">{{ s.csrf() }}<label class="field"><span>Name</span><input name="name" value="{{ request.form.get('name', current_user.name) }}" required maxlength="120">{% if errors.name %}<small class="error">{{ errors.name }}</small>{% endif %}</label><label class="field"><span>Phone number</span><input name="phone" inputmode="numeric" value="{{ request.form.get('phone', current_user.phone or '') }}" maxlength="12">{% if errors.phone %}<small class="error">{{ errors.phone }}</small>{% endif %}</label><label class="field"><span>Email</span><input value="{{ current_user.email }}" disabled><small class="muted">Email address cannot be changed here.</small></label><div class="actions"><button class="btn" type="submit">Save profile</button><a class="btn btn--ghost" href="/account">Cancel</a></div></form></div>{% endblock %}
