# Optional: local PostgreSQL. Run: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nk_user
      POSTGRES_PASSWORD: nk_password
      POSTGRES_DB: nk
    ports:
      - "5432:5432"
    volumes:
      - nk_pgdata:/var/lib/postgresql/data
volumes:
  nk_pgdata:
