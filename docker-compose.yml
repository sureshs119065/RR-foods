# Optional: local PostgreSQL. Run: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nk_user
      POSTGRES_PASSWORD: nk_password
      POSTGRES_DB: nk
    ports:
      - "5432:5432"
    volumes:
      - nk_pgdata:/var/lib/postgresql/data
  redis:            # rate-limit counters shared by every worker: RATELIMIT_STORAGE_URI=redis://localhost:6379/0
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  nk_pgdata:
