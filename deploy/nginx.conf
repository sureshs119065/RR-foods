# /etc/nginx/sites-available/nk   (then: ln -s to sites-enabled, nginx -t, systemctl reload nginx)
# HTTPS: run  certbot --nginx -d shop.example.com  and it adds the 443 block + certificates for you.

limit_req_zone $binary_remote_addr zone=nk_login:10m rate=20r/m;

server {
    listen 80;
    server_name shop.example.com;

    client_max_body_size 32m;                       # matches MAX_UPLOAD_MB plus form overhead

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /static/ {
        alias /srv/nk/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # extra brake on password guessing, on top of the app's own lockout
    location ~ ^/(login|owner/login|admin/login|forgot)$ {
        limit_req zone=nk_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}
