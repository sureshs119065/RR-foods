# Final HTTPS version. Use this AFTER you have a certificate:
#   1) certbot certonly --nginx -d shop.example.com      (or use `certbot --nginx`, which writes a similar block for you)
#   2) replace shop.example.com below, copy to /etc/nginx/sites-available/nk, nginx -t, systemctl reload nginx
#   3) in .env: FLASK_ENV=production, TRUST_PROXY=1, SITE_URL=https://shop.example.com
limit_req_zone $binary_remote_addr zone=nk_login:10m rate=20r/m;
limit_req_status 429;

server {                                         # everything on http goes to https
    listen 80;
    server_name shop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name shop.example.com;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;                           # do not announce the nginx version

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    location /static/ {
        alias /srv/nk/app/static/;
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;   # add_header in a location replaces the server-level ones
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/(login|owner/login|admin/login|forgot)$ {
        limit_req zone=nk_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 60s;
    }
}
