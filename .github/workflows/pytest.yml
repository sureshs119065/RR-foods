name: pytest
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rr_foods_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rr_foods_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rr_foods_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/rr_foods_test
      SECRET_KEY: ci-test-secret
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: flask db upgrade
      - run: pytest -q
